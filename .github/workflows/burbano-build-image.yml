# Burbano-INC: build arm64 images for the home k3s cluster (all nodes are arm64).
# Upstream publishes no image, so we build from an upstream tag that we have pushed to this fork.
# Run:  gh workflow run burbano-build-image.yml -f ref=v1.4.2
#       gh workflow run burbano-build-image.yml -f ref=v1.5.0-rc.2 -f workbench=true -f suffix=-workbench
name: Burbano build image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag or branch to build (e.g. v1.4.2)'
        required: true
      workbench:
        description: 'Compile NEXT_PUBLIC_WORKBENCH_ENABLED=true (v1.5 rc only)'
        type: boolean
        default: false
      suffix:
        description: 'Image tag suffix (e.g. -workbench)'
        required: false
        default: ''
      render:
        description: 'Also build the render-service image'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  app:
    # Native arm64 runner (free for public repos): avoids slow QEMU emulation of the Next.js build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_WORKBENCH_ENABLED=${{ inputs.workbench && 'true' || '' }}
          tags: ghcr.io/burbano-inc/openmaic:${{ inputs.ref }}${{ inputs.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    if: ${{ inputs.render }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./render-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/burbano-inc/openmaic-render:${{ inputs.ref }}
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render
