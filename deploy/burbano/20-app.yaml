apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmaic-data
  namespace: openmaic
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmaic
  namespace: openmaic
  labels: {app.kubernetes.io/name: openmaic}
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO local-path volume
  selector:
    matchLabels: {app.kubernetes.io/name: openmaic}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openmaic}
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi-secondary   # PVC pins the pod here; pi-primary memory limits are ~97% committed
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1001
      containers:
        - name: openmaic
          image: ghcr.io/burbano-inc/openmaic:v1.4.2   # pinned: set image after each release build
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: {name: openmaic-env}   # DEEPSEEK_API_KEY, DATABASE_URL, ACCESS_CODE, OPENMAIC_SECRET_KEY
          env:
            - {name: OWNER_SINGLE_USER, value: "true"}
            - {name: TRUST_PROXY_HEADERS, value: "true"}
            - {name: RENDER_SERVICE_URL, value: "http://openmaic-render:9000"}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: config, mountPath: /app/openmaic.yml, subPath: openmaic.yml, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: openmaic-data}
        - name: config
          configMap: {name: openmaic-config}
---
apiVersion: v1
kind: Service
metadata:
  name: openmaic
  namespace: openmaic
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: openmaic}
  ports:
    - {name: http, port: 3000, targetPort: 3000, nodePort: 30107}
